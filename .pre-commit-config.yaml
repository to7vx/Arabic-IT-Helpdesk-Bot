# Pre-commit hooks. Install once with:  pre-commit install
# See https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Spelling (bilingual project — be conservative with the wordlist)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words=.codespellignore, --skip=*.po,*.lock,*.svg,data/**]
        additional_dependencies:
          - tomli

  # Python (apps/api)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^apps/api/src/
        additional_dependencies: [pydantic, types-redis]

  # JS / TS (apps/web)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|md|yml|yaml|css)$

  # Dockerfiles
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0
    hooks:
      - id: hadolint-docker

  # Conventional Commits message lint
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # SPDX license header
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Add SPDX header to Python sources
        files: ^apps/api/src/.*\.py$
        args:
          - --license-filepath
          - .license-header.txt
          - --comment-style
          - "#"
      - id: insert-license
        name: Add SPDX header to TS sources
        files: ^apps/web/src/.*\.(ts|tsx)$
        args:
          - --license-filepath
          - .license-header.txt
          - --comment-style
          - "//"
