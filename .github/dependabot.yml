version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "web"]
    groups:
      next:
        patterns: ["next", "@next/*", "next-*"]
      lint:
        patterns: ["eslint*", "prettier*", "@typescript-eslint/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "api"]
    groups:
      pydantic:
        patterns: ["pydantic*"]
      sqlalchemy:
        patterns: ["sqlalchemy*", "alembic*"]
      nlp:
        patterns: ["transformers*", "sentence-transformers*", "camel-tools*"]

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
