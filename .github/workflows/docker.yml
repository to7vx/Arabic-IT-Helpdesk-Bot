name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            image: ghcr.io/${{ github.repository }}/api
          - app: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/${{ github.repository }}/web
          - app: worker
            context: apps/api
            dockerfile: apps/api/Dockerfile.worker
            image: ghcr.io/${{ github.repository }}/worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push (skip on missing Dockerfile)
        if: hashFiles(matrix.dockerfile) != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Note skipped build
        if: hashFiles(matrix.dockerfile) == ''
        run: echo "::notice::Dockerfile ${{ matrix.dockerfile }} not present yet; skipping image build for ${{ matrix.app }}."
