[project]
name = "helpdesk-api"
version = "0.1.0"
description = "Arabic IT Helpdesk Bot — FastAPI backend, NLP pipeline, Celery workers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Arabic IT Helpdesk Bot contributors" }]

dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "python-multipart>=0.0.12",
  # Settings & validation
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # DB
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  # Cache / queue
  "redis>=5.1",
  "celery>=5.4",
  # Object storage
  "boto3>=1.35",
  # Auth
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1",
  "python-jose[cryptography]>=3.3",
  "authlib>=1.3",
  "pyotp>=2.9",
  # HTTP client
  "httpx>=0.27",
  # Vector store
  "qdrant-client>=1.12",
  # Observability
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27",
  "prometheus-client>=0.21",
  # Util
  "anyio>=4.6",
  "orjson>=3.10",
  "tenacity>=9.0",
  "email-validator>=2.2",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
nlp = [
  "transformers>=4.45",
  "torch>=2.4",
  "sentence-transformers>=3.1",
  "onnxruntime>=1.19",
  "huggingface-hub>=0.25",
  "rank-bm25>=0.2.2",
  "regex>=2024.9.11",
  # CAMeL Tools requires a heavier install — kept optional.
  "camel-tools>=1.5.5; platform_system != 'Windows'",
]
llm = [
  "anthropic>=0.39",
]
integrations = [
  "imap-tools>=1.7",
  "slack-sdk>=3.33",
  "botbuilder-core>=4.16",
]
dev = [
  "ruff>=0.6.9",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "httpx>=0.27",
  "factory-boy>=3.3",
  "freezegun>=1.5",
  "respx>=0.21",
  "testcontainers[postgres,redis]>=4.8",
  "pip-licenses>=5.0",
  "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.uv]
package = true

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "C4",               # comprehensions
  "S",                # bandit
  "RUF",              # ruff
  "ASYNC",            # async best practices
  "PL",               # pylint
  "PT",               # pytest style
]
ignore = [
  "PLR0913",          # too-many-arguments (FastAPI deps need many)
  "PLR2004",          # magic value used in comparison (noisy)
  "S101",             # assert (we use it in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "camel_tools.*",
  "rank_bm25.*",
  "onnxruntime.*",
  "sentence_transformers.*",
  "transformers.*",
  "passlib.*",
  "pyotp.*",
  "authlib.*",
  "imap_tools.*",
  "slack_sdk.*",
  "botbuilder.*",
  "qdrant_client.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "integration: spins up containers (Postgres, Redis)",
  "slow: takes > 1 second",
  "nlp: requires NLP optional dependencies",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src/helpdesk"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
