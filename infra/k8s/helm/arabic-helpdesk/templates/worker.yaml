apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: { {{- include "arabic-helpdesk.labels" . | nindent 4 }}, app.kubernetes.io/component: worker }
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "arabic-helpdesk.image" (dict "Chart" .Chart "Values" .Values "component" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-env }
          command: ["celery", "-A", "helpdesk.workers.celery_app", "worker", "--loglevel=INFO"]
          args: ["--concurrency={{ .Values.worker.concurrency }}"]
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
