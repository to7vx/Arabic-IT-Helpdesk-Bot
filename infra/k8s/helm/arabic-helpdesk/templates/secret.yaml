{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
type: Opaque
stringData:
  # Operators provide real values via `helm upgrade --set-file env=.env`
  # or by switching externalSecrets.enabled = true.
  DATABASE_URL: "postgresql+asyncpg://helpdesk:CHANGE_ME@{{ .Release.Name }}-postgres:5432/helpdesk"
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  SECRET_KEY: "CHANGE_ME_TO_A_32_BYTE_VALUE"
{{- end }}
