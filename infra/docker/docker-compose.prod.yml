name: arabic-helpdesk-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-arabic-helpdesk/api}:${IMAGE_TAG:-latest}
    env_file: ../../.env
    depends_on: [postgres, redis, qdrant, minio]
    restart: unless-stopped

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-arabic-helpdesk/worker}:${IMAGE_TAG:-latest}
    env_file: ../../.env
    depends_on: [postgres, redis, qdrant]
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-arabic-helpdesk/web}:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_WS_BASE_URL: ${PUBLIC_WS_BASE_URL}
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on: [api, web]
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redisdata:
  qdrant:
  miniodata:
  certbot-etc:
  certbot-var:
