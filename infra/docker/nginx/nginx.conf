worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  client_max_body_size 25M;

  upstream api { server api:8000; }
  upstream web { server web:3000; }

  # Redirect HTTP -> HTTPS (Let's Encrypt verifies via /.well-known/acme-challenge)
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    # ssl_certificate /etc/letsencrypt/live/HOSTNAME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/HOSTNAME/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/   { proxy_pass http://api/api/; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; }
    location /docs   { proxy_pass http://api/docs; }
    location /openapi.json { proxy_pass http://api/openapi.json; }
    location /metrics { deny all; }
    location /ws/    { proxy_pass http://api/ws/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 1h; }
    location /      { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
